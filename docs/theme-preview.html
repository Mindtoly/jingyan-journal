  <style>
    :root {
      color-scheme: light;
      --paper: #f8f6f1;
      --panel: #f0ece4;
      --ink: #25221f;
      --muted: #655b51;
      --wine: #78333a;
      --wine-dark: #5a252d;
      --line: #ded8ce;
      --soft-wine: #efe4e2;
      --song: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      --sans: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
      --bs-body-color: var(--ink);
      --bs-body-bg: var(--paper);
      --bs-body-font-family: var(--sans);
      --bs-border-color: var(--line);
      --bs-link-color-rgb: 120, 51, 58;
      --bs-link-hover-color-rgb: 90, 37, 45;
    }
    [v-cloak] { display: none; }
    body { border-top: 5px solid var(--wine); }
    .page-width { width: min(100% - 5rem, 72rem); margin-inline: auto; }
    .site-header { background: var(--wine-dark); }
    .masthead { align-items: end; gap: 1.25rem 3rem; padding-block: 3.15rem 2.05rem; }
    .masthead h1 { color: #fffdf9; font: 700 clamp(2.2rem, 5vw, 3.7rem)/1.15 var(--song); letter-spacing: .075em; margin: 0; }
    .search { width: min(100%, 22rem); }
    .search .form-control {
      background: #fffdf9;
      border-color: #bfb4a6;
      border-radius: .18rem 0 0 .18rem;
      min-height: 2.6rem;
      padding-inline: .78rem;
    }
    .search input::placeholder { color: var(--muted); }
    .search .btn, .clear-search { border-radius: 0 .18rem .18rem 0; }
    .search .btn { --bs-btn-color: white; --bs-btn-bg: var(--wine); --bs-btn-border-color: #c9a5a7; --bs-btn-hover-color: white; --bs-btn-hover-bg: #8b4148; --bs-btn-hover-border-color: #c9a5a7; padding-inline: 1rem; }
    .search .form-control:focus { border-color: var(--wine); box-shadow: none; }
    .masthead :where(button, input):focus-visible { outline-color: #fffdf9; }
    .site-nav { background: var(--paper); border-block: 1px solid var(--line); }
    .site-nav .nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); justify-items: center; }
    .site-nav .nav-link {
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--ink);
      padding: .85rem 0 .72rem;
      background: transparent;
      font-weight: 550;
    }
    .site-nav .nav-link:hover, .site-nav .nav-link[aria-current="page"] { color: var(--wine); }
    .site-nav .nav-link[aria-current="page"] { border-bottom-color: var(--wine); font-weight: 700; }
    .layout { display: grid; grid-template-columns: 13.25rem minmax(0, 1fr); gap: clamp(1.5rem, 4.6vw, 4.25rem); padding-block: 2.35rem 4.25rem; min-height: 34rem; }
    .layout.layout--single { grid-template-columns: minmax(0, 1fr); }
    .archive-box { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--wine); padding: .55rem .6rem .35rem; align-self: start; }
    .archive-toggle, .archive-backdrop, .archive-close { display: none; }
    .year { border-top: 1px solid var(--line); }
    .archive-close + .year { border-top: 0; }
    .year > summary { font: 500 .9375rem/1.4 var(--sans); padding: .52rem .45rem; border-radius: .15rem; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
    .year > summary::-webkit-details-marker { display: none; }
    .year > summary::after { content: "+"; color: var(--wine); font: 500 .875rem/1 var(--sans); }
    .year[open] > summary { background: var(--soft-wine); }
    .year[open] > summary::after { content: "−"; }
    .month-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .12rem .16rem; padding: .32rem .1rem .45rem; }
    .month {
      border: 1px solid transparent;
      border-radius: .15rem;
      background: transparent;
      color: var(--ink);
      min-height: 1.85rem; padding: .14rem 0;
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
    }
    .month:hover:not(:disabled) { color: var(--wine); border-color: #b89999; background: var(--soft-wine); }
    .month[aria-current="date"], .month[aria-current="date"]:hover { background: var(--wine); border-color: var(--wine); color: white; font-weight: 700; }
    .month:disabled { color: #74695e; opacity: .7; }
    .month:disabled::after { content: ""; display: block; border-bottom: 1px dotted #a2978e; width: .65rem; margin: -.06rem auto 0; }
    .results-heading { padding: .14rem 0 .92rem; gap: .4rem 1rem; border-bottom: 2px solid var(--wine); }
    .results-heading h2 { margin: 0; font: 700 clamp(1.7rem, 3vw, 2.18rem)/1.35 var(--song); overflow-wrap: anywhere; }
    .layout:not(.layout--single) .results-heading { padding-bottom: .55rem; }
    .layout:not(.layout--single) .results-heading h2 { font-size: 1.125rem; }
    .layout:not(.layout--single) .results-heading .month-title { font: 600 1rem/1.4 var(--song); }
    .result-total { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .clear-search { font-size: .86rem; padding: .28rem .58rem; color: var(--wine); border: 1px solid #b89999; background: transparent; }
    .clear-search:hover { background: var(--soft-wine); }
    .article { padding: .72rem 0 .68rem; border-bottom: 1px solid var(--line); }
    .article-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(5.5rem, 20%) 6.25rem;
      align-items: baseline;
      gap: .18rem 1rem;
    }
    .article h3 { margin: 0; font: 650 1.0625rem/1.5 var(--song); overflow-wrap: anywhere; }
    .article h3 a { color: var(--ink); text-decoration: none; text-underline-offset: .23em; }
    .article h3 a:hover { color: var(--wine); text-decoration: underline; }

    .site-footer { padding-block: 1.15rem 1.5rem; border-top: 1px solid var(--line); font-size: .9rem; }

        place-items: center;

        min-height: 2.75rem;

      .archive-backdrop { display: block; position: fixed; inset: 0; z-index: 1040; background: rgb(37 34 31 / .3); touch-action: none; }
      .archive-box {
        position: fixed;
        inset: 0 auto auto 0;
        z-index: 1050;
        width: min(17rem, 82vw);
        height: 100vh;
        height: 100dvh;
        padding: .85rem .8rem 1rem;
        overflow-y: auto;
        overscroll-behavior: contain;
        visibility: hidden;
        transform: translateX(-100%);
        transition: transform .22s ease, visibility 0s linear .22s;
      }
      .month { min-height: 2.5rem; }
      .year > summary { min-height: 2.5rem; }
      .archive-box.is-open { visibility: visible; transform: translateX(0); transition-delay: 0s; }
      .archive-close {
        display: block;
        margin: 0 0 .45rem auto;
        padding: .35rem .55rem;

      .article h3 { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .archive-box { transition: none; }

<body>
  <div id="app" v-cloak>
    <header class="site-header">
      <div class="page-width masthead d-flex justify-content-between">
        <h1>经济研学动态</h1>
        <form class="search input-group" role="search" @submit.prevent="submitSearch">
          <label for="query" class="visually-hidden">检索文章</label>
          <input id="query" v-model="query" class="form-control" type="search" placeholder="检索标题、作者或摘要">
          <button class="btn" type="submit">检索</button>
        </form>
      </div>
      <nav class="site-nav" aria-label="网站栏目">
        <div class="page-width nav">
          <button v-for="item in sections" :key="item.id" class="nav-link" type="button"
            :aria-current="section === item.id && !searchTerm ? 'page' : undefined"
            @click="showSection(item.id)">{{ item.title }}</button>
        </div>
      </nav>
    </header>

    <main class="page-width layout" :class="{ 'layout--single': section !== 'archive' }" @keydown.esc="closeArchive()">
      <button v-show="section === 'archive'" ref="archiveToggle" type="button" class="archive-toggle"
        aria-label="展开日期筛选" aria-controls="archive-panel" :aria-expanded="archiveOpen"
        @click="openArchive">&gt;&gt;</button>
      <div v-show="section === 'archive' && archiveOpen" class="archive-backdrop" aria-hidden="true" @click="closeArchive()"></div>
      <aside v-show="section === 'archive'" id="archive-panel" class="archive-box"
        :class="{ 'is-open': archiveOpen }" aria-label="年月归档">
        <button ref="archiveDismiss" type="button" class="archive-close" @click="closeArchive()">收起</button>
        <details v-for="(year, index) in years" :key="year" class="year" :open="index === 0 ? '' : undefined">
          <summary>{{ year }} 年</summary>
          <div class="month-grid">
            <button v-for="month in months" :key="month" type="button" class="month"
              :disabled="monthId(year, month) > currentMonth"
              :aria-label="year + ' 年 ' + month + ' 月'"
              :aria-current="section === 'archive' && !searchTerm && selection === monthId(year, month) ? 'date' : undefined"
              @click="selectMonth(year, month)">{{ month }}月</button>
          </div>
        </details>
      </aside>

      <section aria-labelledby="results-title">
        <div class="results-heading d-flex flex-wrap align-items-baseline justify-content-between">
          <h2 id="results-title" :class="{ 'month-title': section === 'archive' && !searchTerm }">{{ heading }}</h2>
          <div v-if="section === 'archive'" class="d-flex align-items-center gap-3">
            <span class="result-total" aria-live="polite">{{ results.length }} 篇文章</span>
            <button v-if="searchTerm" class="clear-search" type="button" @click="clearSearch">清空检索</button>
          </div>
        </div>
        <template v-if="section === 'archive'">
          <div :key="searchTerm ? 'search:' + searchTerm : selection">
            <article v-for="article in results" :key="article.title" class="article">
              <div class="article-fields">
                <h3><a :href="pdfLink(article)" target="_blank" rel="noopener"
                  :aria-label="article.title + '，在新标签页打开 PDF'">{{ article.title }}</a></h3>
                <p class="article-author">{{ article.author }}</p>
                <time class="article-date" :datetime="article.date">{{ article.date }}</time>
              </div>
              <details v-if="article.abstract">
                <summary>摘要</summary>
                <p class="abstract">{{ article.abstract }}</p>
              </details>
            </article>
          </div>
          <p v-if="!results.length" class="note">{{ searchTerm ? '未找到相关文章。' : '本月暂无文章。' }}</p>
        </template>
        <p v-else class="note">{{ sections.find(item => item.id === section).text }}</p>
      </section>
    </main>

    <footer class="page-width site-footer d-flex flex-wrap justify-content-between gap-2">
      <span>经济研学动态</span><span>主题演示 · 示例稿件</span>
    </footer>
  </div>
  <noscript><p class="page-width mt-4">启用 JavaScript 后可使用年月归档、摘要与检索。</p></noscript>

  <script>
    "use strict";
    const { createApp, ref, computed, nextTick } = Vue;
    const articles = JSON.parse(document.getElementById("demo-data").textContent)
      .sort((a, b) => b.date.localeCompare(a.date));
    const currentMonth = "2026-11";
    const years = [...new Set(articles.map(article => article.date.slice(0, 4)))].sort().reverse();
    const months = Array.from({ length: 12 }, (_, index) => 12 - index);
    const sections = [
      { id: "archive", title: "文章列表" },
      { id: "style", title: "投稿须知", text: "此栏目展示投稿格式、引注和参考文献要求。" },
      { id: "notices", title: "通知公告", text: "此栏目用于发布刊物公告和通知。" },
      { id: "about", title: "关于我们", text: "《经济研学动态》用于交流经济学学习与研究成果。" },
    ];
    const pdfUrls = new Map();
    function pdfLink(article) {
      if (!pdfUrls.has(article)) {
        const bytes = Uint8Array.from(atob(article.pdf), character => character.charCodeAt(0));
        pdfUrls.set(article, URL.createObjectURL(new Blob([bytes], { type: "application/pdf" })));
      }
      return pdfUrls.get(article);
    }

    createApp({
      setup() {
        const section = ref("archive");
        const selection = ref(articles[0]?.date.slice(0, 7) ?? currentMonth);
        const query = ref("");
        const searchTerm = ref("");
        const archiveOpen = ref(false);
        const archiveToggle = ref(null);
        const archiveDismiss = ref(null);
        const monthId = (year, month) => year + "-" + String(month).padStart(2, "0");
        const normalize = value => value.normalize("NFKC").toLocaleLowerCase();
        const searchableArticles = articles.map(article => ({
          article,
          text: normalize([article.title, article.author, article.abstract].join(" ")),
        }));
        const results = computed(() => {
          if (!searchTerm.value) return articles.filter(article => article.date.startsWith(selection.value));
          const terms = normalize(searchTerm.value).split(/\s+/u);
          return searchableArticles.filter(entry => terms.every(term => entry.text.includes(term)))
            .map(entry => entry.article);
        });
        const heading = computed(() => {
          if (searchTerm.value) return "“" + searchTerm.value + "”的检索结果";
          if (section.value !== "archive") return sections.find(item => item.id === section.value).title;
          const [year, month] = selection.value.split("-");
          return year + " 年 " + Number(month) + " 月";
        });
        function clearSearch() {
          query.value = "";
          searchTerm.value = "";
        }
        async function openArchive() {
          archiveOpen.value = true;
          await nextTick();
          archiveDismiss.value?.focus({ preventScroll: true });
        }
        async function closeArchive(restoreFocus = true) {
          if (!archiveOpen.value) return;
          archiveOpen.value = false;
          if (restoreFocus) {
            await nextTick();
            archiveToggle.value?.focus({ preventScroll: true });
          }
        }
        function showSection(id) {
          section.value = id;
          clearSearch();
          if (id !== "archive") closeArchive(false);
        }
        function selectMonth(year, month) {
          selection.value = monthId(year, month);
          showSection("archive");
          closeArchive();
        }
        function submitSearch() {
          section.value = "archive";
          searchTerm.value = query.value.trim();
        }
        return {
          section, selection, query, searchTerm, currentMonth, years, months, sections,
          archiveOpen, archiveToggle, archiveDismiss, openArchive, closeArchive,
          monthId, results, heading, clearSearch, showSection, selectMonth, submitSearch, pdfLink,
        };
      },
    }).mount("#app");
  </script>
</body>
